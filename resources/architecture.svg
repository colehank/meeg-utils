<text x="760.0" y="122.0" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#0a66d6" text-anchor="middle">meu.steps</text>
<circle cx="1280" cy="92" r="7" fill="white" stroke="#1d1d1f" stroke-width="2"/>
<text x="1280.0" y="70.0" font-family="'Helvetica Neue', Helvetica, Arial, Inter, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f" text-anchor="middle">Epoch</text>
