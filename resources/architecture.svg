<text x="120.0" y="122.0" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#0a66d6" text-anchor="middle">meu.io</text>
<circle cx="400" cy="92" r="7" fill="white" stroke="#1d1d1f" stroke-width="2"/>
