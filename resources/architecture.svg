<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 384" width="1400" height="384" role="img" aria-labelledby="title desc">
<title id="title">meeg-utils: read, check, preprocess, epoch</title>
<desc id="desc">Recordings are read with their BIDS sidecars (meu.io), checked by the acquisition QC (meu.qc), preprocessed run by run in an EEG or an MEG lane (meu.steps), and epoched and combined per session (meu.epochs).</desc>
<rect width="1400" height="384" fill="white"/>
